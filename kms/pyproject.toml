[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kms"
version = "1.0.0"
requires-python = ">=3.11"
description = "Key Management System — KMIP 2.1 compliant with REST API and Web UI"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pyotp>=2.9",
    "python-pkcs11>=0.7",
    "cryptography>=43",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "structlog>=24",
]

[project.scripts]
kms-server = "kms.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
