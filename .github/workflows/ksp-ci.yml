name: KSP CI

# This repository holds more than one project, and the KMIP work has its own
# .github/workflows/ci.yml. Both would own that filename, so this one is
# named for its project and scoped by path: it runs only when the KSP, or
# this workflow itself, actually changes.
on:
  push:
    branches: ['**']
    paths:
      - 'softhsm_ksp/**'
      - '.github/workflows/ksp-ci.yml'
  pull_request:
    paths:
      - 'softhsm_ksp/**'
      - '.github/workflows/ksp-ci.yml'
  workflow_dispatch:

concurrency:
  group: ksp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The fast gate ───────────────────────────────────────────────────────
  # Unit suite plus a Windows cross-compile. mingw-w64 is not the Windows
  # SDK, but it catches the class of defect that let seven of ten source
  # files reach main unable to compile for Windows at all.
  linux:
    name: Unit tests and Windows cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 mingw-w64-common gcovr

      - name: Unit tests
        working-directory: softhsm_ksp/tests/unit
        run: make -f ../Makefile.linux run

      - name: Windows-only integration test parses
        working-directory: softhsm_ksp/tests/unit
        run: make -f ../Makefile.linux syntax-check

      # The mock is hand-written. This fails the build if it disagrees with
      # the real Windows headers, which is how the wrong values for
      # NCRYPT_IMPL_HARDWARE_FLAG and NTE_BAD_KEYSET_PARAM went unnoticed.
      - name: Mock has not drifted from the Windows headers
        working-directory: softhsm_ksp
        run: python3 tests/check_mock_drift.py

      - name: Cross-compile for Windows
        working-directory: softhsm_ksp
        run: |
          set -e
          fail=0
          for f in src/pkcs11/*.c src/ksp/*.c src/common/*.c; do
            # ksp_main.c needs the WDK's ncrypt_provider.h, which mingw-w64
            # does not ship. The windows job below is what covers it.
            if [ "$(basename "$f")" = "ksp_main.c" ]; then
              echo "SKIP $f (needs WDK ncrypt_provider.h)"
              continue
            fi
            if x86_64-w64-mingw32-gcc -c -municode \
                 -DUNICODE -D_UNICODE -DWIN32_LEAN_AND_MEAN \
                 -Isrc/pkcs11 -Isrc/ksp -Isrc/common \
                 "$f" -o /dev/null 2>/tmp/cc.err; then
              echo "OK   $f"
            else
              echo "FAIL $f"; cat /tmp/cc.err; fail=1
            fi
          done
          exit $fail

      - name: Coverage
        working-directory: softhsm_ksp/tests/unit
        run: |
          gcovr --root ../.. --filter '.*/src/.*' --print-summary --txt

  # ── The authority ───────────────────────────────────────────────────────
  # Only this job can answer whether the DLL actually builds. Everything
  # above is a proxy.
  windows:
    name: MSVC build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # NCRYPT_KEY_STORAGE_FUNCTION_TABLE is declared in ncrypt_provider.h,
      # which the first CI run proved is NOT in the hosted runner's Windows
      # Kits. It ships with the WDK. Building a CNG provider therefore
      # requires the WDK, which is a genuine prerequisite this project had
      # never written down.
      - name: Install the WDK
        continue-on-error: true
        run: choco install windowsdriverkit11 --no-progress -y

      # The first attempt searched only Windows Kits\10\Include and found
      # nothing even after the WDK installed. The CPDK puts its headers in a
      # sibling directory, not inside Include, so search the whole tree.
      # Three searches have failed: Windows Kits\10\Include, the whole
      # Windows Kits tree, then every drive. The third was written with
      # Get-ChildItem -Include -Recurse, which walks every file on the disk
      # and ran for over thirteen minutes without finishing. cmd's dir is
      # dramatically faster for a filename lookup, so use that instead.
      - name: Locate ncrypt_provider.h
        id: findhdr
        shell: cmd
        timeout-minutes: 5
        run: |
          @echo off
          echo Searching all drives for ncrypt_provider.h and bcrypt_provider.h
          for %%D in (C D) do (
            if exist %%D:\ (
              dir /s /b %%D:\ncrypt_provider.h 2>nul >> "%RUNNER_TEMP%\hits.txt"
              dir /s /b %%D:\bcrypt_provider.h 2>nul >> "%RUNNER_TEMP%\hits.txt"
            )
          )
          if exist "%RUNNER_TEMP%\hits.txt" (
            echo Found:
            type "%RUNNER_TEMP%\hits.txt"
          ) else (
            echo Neither header exists on this machine, despite the WDK
            echo reporting a successful install.
          )
          for /f "delims=" %%F in ('dir /s /b C:\ncrypt_provider.h 2^>nul') do (
            echo dir=%%~dpF>> "%GITHUB_OUTPUT%"
            echo found=yes>> "%GITHUB_OUTPUT%"
            goto :done
          )
          echo found=no>> "%GITHUB_OUTPUT%"
          :done

      - name: Configure
        run: >
          cmake -S softhsm_ksp -B build -A x64
          "-DCPDK_INCLUDE_DIR=${{ steps.findhdr.outputs.dir }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Report a missing WDK clearly
        if: failure() && steps.findhdr.outputs.found == 'no'
        shell: pwsh
        run: |
          Write-Host "::error::ncrypt_provider.h is not on this machine."
          Write-Host "It declares NCRYPT_KEY_STORAGE_FUNCTION_TABLE and is not in the"
          Write-Host "Windows SDK; installing the WDK did not supply it either. Only"
          Write-Host "ksp_main.c needs it — the other nine files compile clean here."
          Write-Host "Pass -DCPDK_INCLUDE_DIR=<dir> if you have it elsewhere."
          exit 1

      - name: Show output
        shell: pwsh
        run: Get-ChildItem -Recurse build\Release | Select-Object Name, Length

  # ── PowerShell tooling ──────────────────────────────────────────────────
  scripts:
    name: PowerShell scripts parse and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the HLK suite's embedded C#
        shell: pwsh
        run: ./softhsm_ksp/tools/validate_hlk_script.ps1

      - name: Registration script parses and its C# compiles
        shell: pwsh
        working-directory: softhsm_ksp/tools
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'register_ksp.ps1'
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$null, [ref]$errors)
          if ($errors.Count) {
              $errors | ForEach-Object {
                  Write-Host "PARSE ERROR line $($_.Extent.StartLineNumber): $($_.Message)"
              }
              exit 1
          }
          Write-Host 'Parse OK'
          $src   = Get-Content $path -Raw
          $open  = $src.IndexOf('@"')
          $close = $src.IndexOf('"@', $open)
          Add-Type -TypeDefinition $src.Substring($open + 2, $close - $open - 2)
          Write-Host 'C# compiles OK'
