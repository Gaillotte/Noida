name: KSP CI

# This repository holds more than one project, and the KMIP work has its own
# .github/workflows/ci.yml. Both would own that filename, so this one is
# named for its project and scoped by path: it runs only when the KSP, or
# this workflow itself, actually changes.
on:
  push:
    branches: ['**']
    paths:
      - 'softhsm_ksp/**'
      - '.github/workflows/ksp-ci.yml'
  pull_request:
    paths:
      - 'softhsm_ksp/**'
      - '.github/workflows/ksp-ci.yml'
  workflow_dispatch:

concurrency:
  group: ksp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── The fast gate ───────────────────────────────────────────────────────
  # Unit suite plus a Windows cross-compile. mingw-w64 is not the Windows
  # SDK, but it catches the class of defect that let seven of ten source
  # files reach main unable to compile for Windows at all.
  linux:
    name: Unit tests and Windows cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 mingw-w64-common gcovr

      - name: Unit tests
        working-directory: softhsm_ksp/tests/unit
        run: make -f ../Makefile.linux run

      - name: Windows-only integration test parses
        working-directory: softhsm_ksp/tests/unit
        run: make -f ../Makefile.linux syntax-check

      # The mock is hand-written. This fails the build if it disagrees with
      # the real Windows headers, which is how the wrong values for
      # NCRYPT_IMPL_HARDWARE_FLAG and NTE_BAD_KEYSET_PARAM went unnoticed.
      - name: Mock has not drifted from the Windows headers
        working-directory: softhsm_ksp
        run: python3 tests/check_mock_drift.py

      - name: Cross-compile for Windows
        working-directory: softhsm_ksp
        run: |
          set -e
          fail=0
          for f in src/pkcs11/*.c src/ksp/*.c src/common/*.c; do
            # ksp_main.c needs the WDK's ncrypt_provider.h, which mingw-w64
            # does not ship. The windows job below is what covers it.
            if [ "$(basename "$f")" = "ksp_main.c" ]; then
              echo "SKIP $f (needs WDK ncrypt_provider.h)"
              continue
            fi
            if x86_64-w64-mingw32-gcc -c -municode \
                 -DUNICODE -D_UNICODE -DWIN32_LEAN_AND_MEAN \
                 -Isrc/pkcs11 -Isrc/ksp -Isrc/common \
                 "$f" -o /dev/null 2>/tmp/cc.err; then
              echo "OK   $f"
            else
              echo "FAIL $f"; cat /tmp/cc.err; fail=1
            fi
          done
          exit $fail

      - name: Coverage
        working-directory: softhsm_ksp/tests/unit
        run: |
          gcovr --root ../.. --filter '.*/src/.*' --print-summary --txt

  # ── The second backend ──────────────────────────────────────────────────
  # Everything else this project knows about itself comes from a mock we
  # wrote. This job is the only one that tests the claim the architecture
  # rests on — that any PKCS#11 v2.40+ module can back the provider — by
  # running the real p11_* and ksp_* sources against Kryoptic, a PKCS#11
  # token written in Rust by people with no connection to this repository.
  #
  # It earned its place on the first run: it found two defects that had
  # survived 1434 assertions against the mock. See docs/13-roadmap.md,
  # phase 7.
  second-backend:
    name: Against a second PKCS#11 backend (Kryoptic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      # Kryoptic is the slow part of this job, and it only changes when the
      # pinned ref does.
      - name: Cache the Kryoptic build
        id: kryoptic-cache
        uses: actions/cache@v4
        with:
          path: softhsm_ksp/tests/linux/.kryoptic
          key: kryoptic-${{ runner.os }}-main-v1

      - name: Build Kryoptic
        working-directory: softhsm_ksp/tests/linux
        run: make kryoptic

      - name: Initialise a token
        working-directory: softhsm_ksp/tests/linux
        run: make token

      # Twice, against the same token, without re-initialising between.
      # Anything the provider leaves behind is invisible to a single pass —
      # the orphaned-certificate defect was found precisely this way.
      - name: Run the provider against it, twice
        working-directory: softhsm_ksp/tests/linux
        run: make run-twice

  # ── The same provider against a token that can do EdDSA and ML-DSA ──────
  #
  # Separate from the job above because it is a genuinely different token,
  # not a bigger one. That build has the Montgomery generator and NOT the
  # Edwards one, which is what showed the two are separate mechanisms; this
  # one has both, plus CKM_EDDSA and the post-quantum mechanisms.
  #
  # Every capability-dependent assertion in the suite asks the token and
  # requires the provider to agree, so the same source is a real test under
  # either configuration: it checks that the gate opens here and that it
  # closes there. Running only one of them would leave half of the
  # capability probe unexercised.
  #
  # The cost is an OpenSSL build — Kryoptic gates eddsa on 3.2 and the
  # post-quantum mechanisms on 3.5, and the runner image ships 3.0.
  second-backend-pqc:
    name: Against a post-quantum capable Kryoptic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config

      # Both halves are slow and both are pinned, so both are cached. The
      # keys carry the pinned versions: bumping either rebuilds only it.
      - name: Cache the OpenSSL build
        uses: actions/cache@v4
        with:
          path: softhsm_ksp/tests/linux/.openssl
          key: openssl-${{ runner.os }}-3.5.8-v1

      - name: Cache the Kryoptic build
        uses: actions/cache@v4
        with:
          path: softhsm_ksp/tests/linux/.kryoptic
          key: kryoptic-pqc-${{ runner.os }}-main-v1

      - name: Build OpenSSL and Kryoptic with eddsa + pqc
        working-directory: softhsm_ksp/tests/linux
        run: make kryoptic-pqc

      - name: Initialise a token
        working-directory: softhsm_ksp/tests/linux
        run: make token

      - name: Run the provider against it, twice
        working-directory: softhsm_ksp/tests/linux
        run: make run-twice

  # ── The authority ───────────────────────────────────────────────────────
  # Only this job can answer whether the DLL actually builds. Everything
  # above is a proxy.
  windows:
    name: MSVC build
    runs-on: windows-latest
    # Hoisted to the job so the signing step's `if` can read it. A step's
    # own `env:` block is not visible to that step's condition.
    env:
      KSP_SIGN_PFX_BASE64:   ${{ secrets.KSP_SIGN_PFX_BASE64 }}
      KSP_SIGN_PFX_PASSWORD: ${{ secrets.KSP_SIGN_PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # ncrypt_provider.h, which declares NCRYPT_KEY_STORAGE_FUNCTION_TABLE,
      # does not exist on a GitHub-hosted Windows runner. Established, not
      # assumed: a dir /s /b across C: and D: returned exactly one hit, this
      # repository's own test mock, and that was after `choco install
      # windowsdriverkit11` reported success. The WDK install step is gone
      # because it cost three minutes a run and never supplied the header.
      #
      # So this job builds what MSVC can build — nine of the ten source
      # files, plus test_p11_layer — and CMake skips the DLL target rather
      # than emitting one without its entry point. TABLE-01 and BUILD-01
      # stay open in the feature matrix until a machine with the header
      # proves the whole DLL builds.
      - name: Configure
        run: cmake -S softhsm_ksp -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      # A green job here must not be mistaken for "the DLL builds".
      - name: Confirm the DLL was not silently produced
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter softhsm_ksp.dll -ErrorAction SilentlyContinue
          if ($dll) {
            Write-Host "softhsm_ksp.dll was built: $($dll[0].FullName)"
            "### KSP DLL built" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          } else {
            Write-Host "::warning::softhsm_ksp.dll was NOT built - ncrypt_provider.h is unavailable on hosted runners. Nine of ten sources compiled; the DLL target was skipped by design."
            @(
              "### KSP DLL not built"
              ""
              "``ncrypt_provider.h`` is not available on GitHub-hosted Windows"
              "runners, so CMake skipped the ``softhsm_ksp`` target rather than"
              "produce a DLL without its entry point."
              ""
              "MSVC did compile the other nine source files and ``test_p11_layer``."
              "See ``softhsm_ksp/docs/13-roadmap.md`` (BUILD-01, TABLE-01)."
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      # Signing runs only when a certificate is configured. There is none
      # today (OPS-03 needs a purchased certificate and a legal entity), so
      # this step is normally skipped — but it is wired now so that adding
      # the secret is the only step left, rather than a procedure to work
      # out later.
      - name: Sign the DLL
        if: env.KSP_SIGN_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx,
              [Convert]::FromBase64String($env:KSP_SIGN_PFX_BASE64))
          try {
              ./softhsm_ksp/tools/sign_ksp.ps1 -PfxPath $pfx `
                  -DllPath build/Release/softhsm_ksp.dll
          } finally {
              # The runner is ephemeral, but a build artefact step running
              # afterwards would otherwise pick the certificate up.
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      # sign_ksp.ps1 has never actually signed anything — it only parsed.
      # That is the failure mode this project keeps hitting: tooling that
      # looks right and was never run. A self-signed certificate exercises
      # the whole path against the real signtool: sign, timestamp, verify,
      # and the verification parsing that decides whether a timestamp was
      # applied.
      #
      # This proves the TOOLING, not the product. A self-signed certificate
      # is not a code-signing identity; OPS-03 still needs one bought by a
      # verified legal entity, and the artefact this job publishes stays
      # unsigned.
      - name: Signing pipeline self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # test_p11_layer.exe builds even without ncrypt_provider.h, so
          # there is always a real PE file to sign.
          $target = 'build/Release/test_p11_layer.exe'
          if (-not (Test-Path $target)) {
              Write-Host "::warning::$target not built; cannot self-test signing."
              exit 0
          }

          $work = Join-Path $env:RUNNER_TEMP 'signtest'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Copy-Item $target (Join-Path $work 'subject.exe')
          $subject = Join-Path $work 'subject.exe'

          $cert = New-SelfSignedCertificate `
              -Subject 'CN=KSP CI Signing Self-Test' `
              -Type CodeSigningCert `
              -CertStoreLocation Cert:\CurrentUser\My `
              -NotAfter (Get-Date).AddDays(1)
          Write-Host "Test certificate: $($cert.Thumbprint)"

          $pfx = Join-Path $work 'selftest.pfx'
          $pw  = [Guid]::NewGuid().ToString()
          $sec = ConvertTo-SecureString -String $pw -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $sec | Out-Null

          # signtool verify checks the chain, so the throwaway root has to
          # be trusted for the verification half to mean anything. The
          # runner is destroyed after the job.
          Import-Certificate -FilePath (Export-Certificate -Cert $cert `
              -FilePath (Join-Path $work 'selftest.cer')).FullName `
              -CertStoreLocation Cert:\CurrentUser\Root | Out-Null

          try {
              $env:KSP_SIGN_PFX_PASSWORD = $pw
              ./softhsm_ksp/tools/sign_ksp.ps1 -PfxPath $pfx -DllPath $subject
              Write-Host ''
              Write-Host 'Re-checking with -VerifyOnly:'
              ./softhsm_ksp/tools/sign_ksp.ps1 -VerifyOnly -DllPath $subject
              Write-Host ''
              Write-Host 'Signing pipeline works end to end.'
          } finally {
              $env:KSP_SIGN_PFX_PASSWORD = $null
              Remove-Item $pfx -Force -ErrorAction SilentlyContinue
              Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
              Remove-Item "Cert:\CurrentUser\Root\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }

      # Reported either way. An unsigned DLL is the expected state today;
      # what matters is that the state is visible rather than assumed.
      - name: Report signature state
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $dll = 'build/Release/softhsm_ksp.dll'
          if (-not (Test-Path $dll)) {
              Write-Host 'No DLL built; nothing to check. See BUILD-01.'
              exit 0
          }
          ./softhsm_ksp/tools/sign_ksp.ps1 -VerifyOnly -DllPath $dll

      - name: Show output
        shell: pwsh
        run: Get-ChildItem -Recurse build\Release -ErrorAction SilentlyContinue | Select-Object Name, Length

  # ── PowerShell tooling ──────────────────────────────────────────────────
  scripts:
    name: PowerShell scripts parse and compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the HLK suite's embedded C#
        shell: pwsh
        run: ./softhsm_ksp/tools/validate_hlk_script.ps1

      - name: Signing script parses
        shell: pwsh
        working-directory: softhsm_ksp/tools
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path 'sign_ksp.ps1').Path, [ref]$null, [ref]$errors)
          if ($errors.Count) {
              $errors | ForEach-Object {
                  Write-Host "PARSE ERROR line $($_.Extent.StartLineNumber): $($_.Message)"
              }
              exit 1
          }
          Write-Host 'sign_ksp.ps1 parses OK'

      - name: Registration script parses and its C# compiles
        shell: pwsh
        working-directory: softhsm_ksp/tools
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'register_ksp.ps1'
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$null, [ref]$errors)
          if ($errors.Count) {
              $errors | ForEach-Object {
                  Write-Host "PARSE ERROR line $($_.Extent.StartLineNumber): $($_.Message)"
              }
              exit 1
          }
          Write-Host 'Parse OK'
          $src   = Get-Content $path -Raw
          $open  = $src.IndexOf('@"')
          $close = $src.IndexOf('"@', $open)
          Add-Type -TypeDefinition $src.Substring($open + 2, $close - $open - 2)
          Write-Host 'C# compiles OK'
